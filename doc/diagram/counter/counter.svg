<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="620" viewBox="0 0 1860 620"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : counter -->
  <!-- stage  : 2 - diagram L2 (gate-level logic diagram) -->
  <!-- source : doc/spec/architecture/counter_spec.md, doc/spec/register_file/register_map.md -->
  <desc id="model"><![CDATA[
// sys_clk rising edge, sys_rst_n asynchronous active-low (not drawn: clock triangle / reset bubble)
// cnt is unsigned; cnt = {TDR1, TDR0}
[bus_wr_en]
tdr_wr_en = {tdr1_wr_en, tdr0_wr_en};
[op_wr]
cnt_wr = (tdr_wr_en != 8'h0);
[mux_b0]
cnt_wdata[7:0] = tdr_wr_en[0] ? tim_pwdata[7:0] : cnt[7:0];
[mux_b1]
cnt_wdata[15:8] = tdr_wr_en[1] ? tim_pwdata[15:8] : cnt[15:8];
[mux_b2]
cnt_wdata[23:16] = tdr_wr_en[2] ? tim_pwdata[23:16] : cnt[23:16];
[mux_b3]
cnt_wdata[31:24] = tdr_wr_en[3] ? tim_pwdata[31:24] : cnt[31:24];
[mux_b4]
cnt_wdata[39:32] = tdr_wr_en[4] ? tim_pwdata[7:0] : cnt[39:32];
[mux_b5]
cnt_wdata[47:40] = tdr_wr_en[5] ? tim_pwdata[15:8] : cnt[47:40];
[mux_b6]
cnt_wdata[55:48] = tdr_wr_en[6] ? tim_pwdata[23:16] : cnt[55:48];
[mux_b7]
cnt_wdata[63:56] = tdr_wr_en[7] ? tim_pwdata[31:24] : cnt[63:56];
[bus_wdata]
// cnt_wdata[63:0] = {byte 7 .. byte 0} from mux_b7 .. mux_b0
[op_inc]
cnt_inc = cnt + 64'd1;   // wraps modulo 2^64
[mux_en]
cnt_run = cnt_en ? cnt_inc : cnt;
[mux_wr]
cnt_wsel = cnt_wr ? cnt_wdata : cnt_run;
[mux_clr]
cnt_d = cnt_clr ? 64'h0 : cnt_wsel;
[reg_cnt]
cnt <= cnt_d @(rst=64'h0);
]]></desc>
