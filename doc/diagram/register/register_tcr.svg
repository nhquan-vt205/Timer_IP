<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="980" viewBox="0 0 1620 980"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : register -->
  <!-- stage  : 2 - diagram L1 (TCR + wr_err) -->
  <!-- source : doc/spec/architecture/register_spec.md + doc/spec/register_file/register_map.md -->
  <!-- scope  : from wr_en, sel_tcr, tim_pstrb, tim_pwdata to wr_err, tim_en, div_en, div_val -->
  <desc id="model"><![CDATA[
// Scope view (gate-level detail of blk_tcr in register.svg). S3 reads register.svg.
// sys_clk rising edge, sys_rst_n asynchronous active-low (clock triangle / reset bubble).

[gate_tcr_we0]
tcr_we0 = wr_en & sel_tcr & tim_pstrb[0];
[mux_tim_en]
tim_en_d = tcr_we0 ? tim_pwdata[0] : tim_en;
[reg_tim_en]
tim_en <= tim_en_d @(rst=1'b0);
[mux_div_en]
div_en_d = tcr_we0 ? tim_pwdata[1] : div_en;
[reg_div_en]
div_en <= div_en_d @(rst=1'b0);
[gate_tcr_we1]
tcr_we1 = wr_en & sel_tcr & tim_pstrb[1];
[mux_div_val]
div_val_d = tcr_we1 ? tim_pwdata[11:8] : div_val;
[reg_div_val]
div_val <= div_val_d @(rst=4'h1);
[op_dv_ne]
div_val_ne = (tim_pwdata[11:8] != div_val);
[gate_dv_chg]
div_val_chg = tim_pstrb[1] & div_val_ne;
[op_de_ne]
div_en_ne = (tim_pwdata[1] != div_en);
[gate_de_chg]
div_en_chg = tim_pstrb[0] & div_en_ne;
[op_gt8]
div_val_gt8 = (tim_pwdata[11:8] > 4'd8);
[gate_dv_bad]
div_val_bad = tim_pstrb[1] & div_val_gt8;
[gate_chg_or]
div_any_chg = div_val_chg | div_en_chg;
[gate_div_chg]
div_chg = tim_en & div_any_chg;
[gate_err_or]
wr_err_any = div_val_bad | div_chg;
[gate_wr_err]
wr_err = sel_tcr & wr_err_any;
]]></desc>
