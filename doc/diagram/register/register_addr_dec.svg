  <!-- scope  : from tim_paddr to sel_tcr .. sel_thcsr -->
  <desc id="model"><![CDATA[
// Scope view (gate-level detail of the address compare of every block in register.svg). S3 reads register.svg.
// Each sel_* is used by exactly one block of register.svg (written inside that block).
[op_sel_tcr]
sel_tcr = (tim_paddr[11:2] == 10'h000);
[op_sel_tdr0]
sel_tdr0 = (tim_paddr[11:2] == 10'h001);
[op_sel_tdr1]
sel_tdr1 = (tim_paddr[11:2] == 10'h002);
[op_sel_tcmp0]
sel_tcmp0 = (tim_paddr[11:2] == 10'h003);
[op_sel_tcmp1]
sel_tcmp1 = (tim_paddr[11:2] == 10'h004);
[op_sel_tier]
sel_tier = (tim_paddr[11:2] == 10'h005);
[op_sel_tisr]
sel_tisr = (tim_paddr[11:2] == 10'h006);
[op_sel_thcsr]
sel_thcsr = (tim_paddr[11:2] == 10'h007);
]]></desc>
