<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1030" viewBox="0 0 1460 1030"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : register -->
  <!-- stage  : 2 - diagram L1 (block overview; gate-level detail in register_<block>.svg) -->
  <!-- source : doc/spec/architecture/register_spec.md + doc/spec/register_file/register_map.md -->
  <desc id="model"><![CDATA[
// sys_clk rising edge, sys_rst_n asynchronous active-low (clock triangle / reset bubble).
// Detail (gate level) of every block: register_<block>.svg; this model is complete.
[blk_ctrl]
sel_tdr0 = (tim_paddr[11:2] == 10'h001);
sel_tdr1 = (tim_paddr[11:2] == 10'h002);
sel_tier = (tim_paddr[11:2] == 10'h005);
sel_tisr = (tim_paddr[11:2] == 10'h006);
sel_thcsr = (tim_paddr[11:2] == 10'h007);
tdr0_wr_en = (wr_en & sel_tdr0) ? tim_pstrb : 4'h0;
tdr1_wr_en = (wr_en & sel_tdr1) ? tim_pstrb : 4'h0;
int_st_clr = wr_en & sel_tisr & tim_pstrb[0] & tim_pwdata[0];
tier_we    = wr_en & sel_tier & tim_pstrb[0];
int_en_d   = tier_we ? tim_pwdata[0] : int_en;
int_en    <= int_en_d @(rst=1'b0);                         // TIER.INT_EN
thcsr_we   = wr_en & sel_thcsr & tim_pstrb[0];
halt_req_d = thcsr_we ? tim_pwdata[0] : halt_req;
halt_req  <= halt_req_d @(rst=1'b0);                       // THCSR.HALT_REQ
[blk_tcr]
sel_tcr     = (tim_paddr[11:2] == 10'h000);
tcr_we0     = wr_en & sel_tcr & tim_pstrb[0];
tcr_we1     = wr_en & sel_tcr & tim_pstrb[1];
tim_en_d    = tcr_we0 ? tim_pwdata[0] : tim_en;
tim_en     <= tim_en_d @(rst=1'b0);                        // TCR.TIM_EN
div_en_d    = tcr_we0 ? tim_pwdata[1] : div_en;
div_en     <= div_en_d @(rst=1'b0);                        // TCR.DIV_EN
div_val_d   = tcr_we1 ? tim_pwdata[11:8] : div_val;
div_val    <= div_val_d @(rst=4'h1);                       // TCR.DIV_VAL
div_val_bad = tim_pstrb[1] & (tim_pwdata[11:8] > 4'd8);
div_val_chg = tim_pstrb[1] & (tim_pwdata[11:8] != div_val);
div_en_chg  = tim_pstrb[0] & (tim_pwdata[1] != div_en);
div_chg     = tim_en & (div_val_chg | div_en_chg);
wr_err      = sel_tcr & (div_val_bad | div_chg);           // combinational
[blk_tcmp0]
sel_tcmp0 = (tim_paddr[11:2] == 10'h003);
tcmp0_we  = wr_en & sel_tcmp0;
tcmp0_d[7:0] = (tcmp0_we & tim_pstrb[0]) ? tim_pwdata[7:0] : tcmp0[7:0];
tcmp0[7:0] <= tcmp0_d[7:0] @(rst=8'hFF);
tcmp0_d[15:8] = (tcmp0_we & tim_pstrb[1]) ? tim_pwdata[15:8] : tcmp0[15:8];
tcmp0[15:8] <= tcmp0_d[15:8] @(rst=8'hFF);
tcmp0_d[23:16] = (tcmp0_we & tim_pstrb[2]) ? tim_pwdata[23:16] : tcmp0[23:16];
tcmp0[23:16] <= tcmp0_d[23:16] @(rst=8'hFF);
tcmp0_d[31:24] = (tcmp0_we & tim_pstrb[3]) ? tim_pwdata[31:24] : tcmp0[31:24];
tcmp0[31:24] <= tcmp0_d[31:24] @(rst=8'hFF);
[blk_tcmp1]
sel_tcmp1 = (tim_paddr[11:2] == 10'h004);
tcmp1_we  = wr_en & sel_tcmp1;
tcmp1_d[7:0] = (tcmp1_we & tim_pstrb[0]) ? tim_pwdata[7:0] : tcmp1[7:0];
tcmp1[7:0] <= tcmp1_d[7:0] @(rst=8'hFF);
tcmp1_d[15:8] = (tcmp1_we & tim_pstrb[1]) ? tim_pwdata[15:8] : tcmp1[15:8];
tcmp1[15:8] <= tcmp1_d[15:8] @(rst=8'hFF);
tcmp1_d[23:16] = (tcmp1_we & tim_pstrb[2]) ? tim_pwdata[23:16] : tcmp1[23:16];
tcmp1[23:16] <= tcmp1_d[23:16] @(rst=8'hFF);
tcmp1_d[31:24] = (tcmp1_we & tim_pstrb[3]) ? tim_pwdata[31:24] : tcmp1[31:24];
tcmp1[31:24] <= tcmp1_d[31:24] @(rst=8'hFF);
[blk_rd_mux]
always @(*) case (tim_paddr[11:2])
  10'h000: rdata_mux = {20'h0, div_val, 6'h0, div_en, tim_en};   // TCR
  10'h001: rdata_mux = cnt[31:0];                                 // TDR0
  10'h002: rdata_mux = cnt[63:32];                                // TDR1
  10'h003: rdata_mux = tcmp0;                                     // TCMP0
  10'h004: rdata_mux = tcmp1;                                     // TCMP1
  10'h005: rdata_mux = {31'h0, int_en};                           // TIER
  10'h006: rdata_mux = {31'h0, int_st};                           // TISR
  10'h007: rdata_mux = {30'h0, halt_ack, halt_req};               // THCSR
  default: rdata_mux = 32'h0;                                     // reserved: RAZ
endcase
rdata = rd_en ? rdata_mux : 32'h0;
]]></desc>
