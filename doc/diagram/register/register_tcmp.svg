<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1560" viewBox="0 0 960 1560"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : register -->
  <!-- stage  : 2 - diagram L1 (TCMP0 / TCMP1 byte registers) -->
  <!-- source : doc/spec/architecture/register_spec.md + doc/spec/register_file/register_map.md -->
  <!-- scope  : from wr_en, sel_tcmp0, sel_tcmp1, tim_pstrb, tim_pwdata to tcmp0, tcmp1 -->
  <desc id="model"><![CDATA[
// Scope view (gate-level detail of blk_tcmp0 / blk_tcmp1 in register.svg). S3 reads register.svg.
// sys_clk rising edge, sys_rst_n asynchronous active-low (clock triangle / reset bubble).
[gate_tcmp0_we]
tcmp0_we = wr_en & sel_tcmp0;
[gate_tcmp0_bwe0]
tcmp0_bwe[0] = tcmp0_we & tim_pstrb[0];
[mux_tcmp0_b0]
tcmp0_d[7:0] = tcmp0_bwe[0] ? tim_pwdata[7:0] : tcmp0[7:0];
[reg_tcmp0_b0]
tcmp0[7:0] <= tcmp0_d[7:0] @(rst=8'hFF);
[gate_tcmp0_bwe1]
tcmp0_bwe[1] = tcmp0_we & tim_pstrb[1];
[mux_tcmp0_b1]
tcmp0_d[15:8] = tcmp0_bwe[1] ? tim_pwdata[15:8] : tcmp0[15:8];
[reg_tcmp0_b1]
tcmp0[15:8] <= tcmp0_d[15:8] @(rst=8'hFF);
[gate_tcmp0_bwe2]
tcmp0_bwe[2] = tcmp0_we & tim_pstrb[2];
[mux_tcmp0_b2]
tcmp0_d[23:16] = tcmp0_bwe[2] ? tim_pwdata[23:16] : tcmp0[23:16];
[reg_tcmp0_b2]
tcmp0[23:16] <= tcmp0_d[23:16] @(rst=8'hFF);
[gate_tcmp0_bwe3]
tcmp0_bwe[3] = tcmp0_we & tim_pstrb[3];
[mux_tcmp0_b3]
tcmp0_d[31:24] = tcmp0_bwe[3] ? tim_pwdata[31:24] : tcmp0[31:24];
[reg_tcmp0_b3]
tcmp0[31:24] <= tcmp0_d[31:24] @(rst=8'hFF);
[gate_tcmp1_we]
tcmp1_we = wr_en & sel_tcmp1;
[gate_tcmp1_bwe0]
tcmp1_bwe[0] = tcmp1_we & tim_pstrb[0];
[mux_tcmp1_b0]
tcmp1_d[7:0] = tcmp1_bwe[0] ? tim_pwdata[7:0] : tcmp1[7:0];
[reg_tcmp1_b0]
tcmp1[7:0] <= tcmp1_d[7:0] @(rst=8'hFF);
[gate_tcmp1_bwe1]
tcmp1_bwe[1] = tcmp1_we & tim_pstrb[1];
[mux_tcmp1_b1]
tcmp1_d[15:8] = tcmp1_bwe[1] ? tim_pwdata[15:8] : tcmp1[15:8];
[reg_tcmp1_b1]
tcmp1[15:8] <= tcmp1_d[15:8] @(rst=8'hFF);
[gate_tcmp1_bwe2]
tcmp1_bwe[2] = tcmp1_we & tim_pstrb[2];
[mux_tcmp1_b2]
tcmp1_d[23:16] = tcmp1_bwe[2] ? tim_pwdata[23:16] : tcmp1[23:16];
[reg_tcmp1_b2]
tcmp1[23:16] <= tcmp1_d[23:16] @(rst=8'hFF);
[gate_tcmp1_bwe3]
tcmp1_bwe[3] = tcmp1_we & tim_pstrb[3];
[mux_tcmp1_b3]
tcmp1_d[31:24] = tcmp1_bwe[3] ? tim_pwdata[31:24] : tcmp1[31:24];
[reg_tcmp1_b3]
tcmp1[31:24] <= tcmp1_d[31:24] @(rst=8'hFF);
]]></desc>
