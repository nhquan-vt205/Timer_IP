<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- tb_timer_top - testbench structure (tb/tb_timer_top*.v, tc/TC_TIMER_TOP_*.v) -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .w{fill:none;stroke:#000;stroke-width:1.5}
    .b{fill:none;stroke:#000;stroke-width:3.5}
    .c{fill:none;stroke:#000;stroke-width:1.5;stroke-dasharray:7 4}
    .blk{fill:#fff;stroke:#000;stroke-width:1.5}
    .dut{fill:#eee;stroke:#000;stroke-width:2}
    .sub{fill:#fff;stroke:#000;stroke-width:1}
    .seq{fill:#f7f7f7;stroke:#000;stroke-width:1.5}
    .dot{fill:#000}
    .t{font-weight:bold;font-size:14px}
    .s{font-size:11px}
    .m{font-family:Consolas, "DejaVu Sans Mono", monospace;font-size:11px}
    .tag{font-size:11px;fill:#666}
    text{fill:#000;white-space:pre}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="30" font-size="20" font-weight="bold">tb_timer_top - testbench structure</text>
  <text x="20" y="50" font-size="12">Verilog-2005 | tb/tb_timer_top*.v (sim/tb.f, group main) + tc/TC_TIMER_TOP_&lt;NNN&gt;.v | make -C sim all TESTNAME=TC_TIMER_TOP_&lt;NNN&gt;</text>

  <!-- ===== testbench top ===== -->
  <rect x="20" y="62" width="1460" height="903" fill="none" stroke="#000" stroke-width="2"/>
  <text x="32" y="82" class="t">tb_timer_top  (tb/tb_timer_top.v)</text>
  <text x="32" y="98" class="s">black box: stimulus on timer_top ports only, no force / deposit, no internal signal read</text>

  <!-- ===== u_clk_rst ===== -->
  <rect class="blk" x="380" y="105" width="300" height="50"/>
  <text x="390" y="122" class="t">u_clk_rst</text>
  <text x="672" y="120" class="tag" text-anchor="end">sec 3</text>
  <text x="390" y="137" class="s">tb_timer_top_clk_rst (CLK_PERIOD = 20, clk_cnt never reset)</text>
  <text x="390" y="150" class="s">apply_reset(n) / assert_mid / release_after(n)  [RESET]</text>

  <!-- clk / rst_n / clk_cnt distribution -->
  <path class="w" d="M680,125 H1450 V720 H1390" marker-end="url(#arr)"/>
  <text x="690" y="119">clk, rst_n, clk_cnt[31:0]</text>
  <line class="w" x1="480" y1="155" x2="480" y2="200" marker-end="url(#arr)"/>
  <text x="486" y="182" class="s">clk, clk_cnt</text>
  <circle class="dot" cx="880" cy="125" r="4"/>
  <line class="w" x1="880" y1="125" x2="880" y2="200" marker-end="url(#arr)"/>
  <text x="886" y="158" class="s">sys_clk, sys_rst_n</text>
  <circle class="dot" cx="1290" cy="125" r="4"/>
  <line class="w" x1="1290" y1="125" x2="1290" y2="200" marker-end="url(#arr)"/>
  <text x="1296" y="158" class="s">clk, rst_n, clk_cnt</text>
  <text x="1398" y="714" class="s">clk, rst_n</text>

  <!-- ===== test case ===== -->
  <rect class="seq" x="40" y="200" width="290" height="340"/>
  <text x="50" y="220" class="t">Test case (stimulus only)</text>
  <text x="322" y="216" class="tag" text-anchor="end">sec 9</text>
  <text x="50" y="237">tc/TC_TIMER_TOP_001..013.v</text>
  <text x="50" y="253" class="s">one file per VPLAN Item, no expected value;</text>
  <text x="50" y="267" class="s">make build -> sim/run_test.v, `include in sec 9</text>
  <text x="50" y="290" class="m">initial begin</text>
  <text x="50" y="305" class="m">  init_test("&lt;ID&gt;", "&lt;objective&gt;");</text>
  <text x="50" y="320" class="m">  u_log.item("&lt;Item&gt;");</text>
  <text x="50" y="335" class="m">  begin : &lt;sub_item&gt;</text>
  <text x="50" y="350" class="m">    u_log.sub1("&lt;Sub item 1&gt;");</text>
  <text x="50" y="365" class="m">    u_log.goal("&lt;goal&gt;");</text>
  <text x="50" y="380" class="m">    reset_dut;</text>
  <text x="50" y="395" class="m">    apb_write(addr, wdata, strb);</text>
  <text x="50" y="410" class="m">    apb_read(addr);</text>
  <text x="50" y="425" class="m">    wait_cycles(n) / wait_undriven(n);</text>
  <text x="50" y="440" class="m">    set_dbg_mode(v);</text>
  <text x="50" y="455" class="m">    reset_mid_cycle / release_reset;</text>
  <text x="50" y="470" class="m">    u_chk.checkpoint("&lt;what&gt;");</text>
  <text x="50" y="485" class="m">  end</text>
  <text x="50" y="500" class="m">  end_test;</text>
  <text x="50" y="515" class="m">end</text>

  <!-- ===== sequence tasks of the TB top ===== -->
  <rect class="seq" x="40" y="600" width="290" height="340"/>
  <text x="50" y="620" class="t">Sequence tasks</text>
  <text x="322" y="616" class="tag" text-anchor="end">sec 4 / 8 / 9</text>
  <text x="50" y="642" class="s">reset_dut: u_drv.drive_idle +</text>
  <text x="50" y="656" class="s">    u_clk_rst.apply_reset(RESET_CYCLES = 2)</text>
  <text x="50" y="673" class="s">reset_mid_cycle: u_clk_rst.assert_mid</text>
  <text x="50" y="690" class="s">release_reset: u_clk_rst.release_after(2)</text>
  <text x="50" y="707" class="s">apb_write(addr, wdata, strb): u_drv.apb_write</text>
  <text x="50" y="724" class="s">apb_read(addr): u_drv.apb_read</text>
  <text x="50" y="741" class="s">read_all_regs: 8 x apb_read, TCR .. THCSR</text>
  <text x="50" y="758" class="s">wait_cycles(n): u_drv.idle(n), bus 0</text>
  <text x="50" y="775" class="s">wait_undriven(n): u_drv.idle_x(n), bus X</text>
  <text x="50" y="792" class="s">set_dbg_mode(v): u_drv.set_dbg_mode(v)</text>
  <text x="50" y="809" class="s">    each of the above ends with u_chk.sync</text>
  <text x="50" y="826" class="s">init_test(id, objective): u_log.init + banner,</text>
  <text x="50" y="840" class="s">    tdr_cnt_view = count_item(id)</text>
  <text x="50" y="857" class="s">end_test: u_log.summary + $finish</text>
  <text x="50" y="874" class="s">timeout (TIMEOUT_NS = 200000):</text>
  <text x="50" y="888" class="s">    u_log.error_msg + end_test</text>
  <text x="50" y="910" class="s">helpers (sec 7): reg_name, field_names,</text>
  <text x="50" y="924" class="s">    count_item (read by u_chk, u_drv)</text>

  <!-- ===== task calls ===== -->
  <line class="c" x1="185" y1="540" x2="185" y2="600" marker-end="url(#arr)"/>
  <text x="193" y="574" class="s">calls</text>
  <line class="c" x1="330" y1="400" x2="350" y2="400"/>
  <line class="c" x1="330" y1="700" x2="350" y2="700"/>
  <line class="c" x1="350" y1="130" x2="350" y2="760"/>
  <circle class="dot" cx="350" cy="300" r="4"/>
  <circle class="dot" cx="350" cy="400" r="4"/>
  <circle class="dot" cx="350" cy="620" r="4"/>
  <circle class="dot" cx="350" cy="700" r="4"/>
  <line class="c" x1="350" y1="130" x2="380" y2="130" marker-end="url(#arr)"/>
  <line class="c" x1="350" y1="300" x2="380" y2="300" marker-end="url(#arr)"/>
  <path class="c" d="M350,620 H820 V640" marker-end="url(#arr)"/>
  <text x="626" y="614" class="s">sync / checkpoint</text>
  <line class="c" x1="350" y1="760" x2="380" y2="760" marker-end="url(#arr)"/>

  <!-- ===== u_drv ===== -->
  <rect class="blk" x="380" y="200" width="220" height="320"/>
  <text x="390" y="220" class="t">u_drv</text>
  <text x="592" y="216" class="tag" text-anchor="end">sec 8</text>
  <text x="390" y="237">tb_timer_top_drv</text>
  <text x="390" y="253" class="s">APB master + dbg_mode (MAX_WAIT = 8)</text>
  <text x="390" y="278" class="s">drive_idle</text>
  <text x="390" y="294" class="s">apb_write / apb_read</text>
  <text x="390" y="308" class="s">  apb_xfer: setup, access until</text>
  <text x="390" y="322" class="s">  pready = 1 (&gt; MAX_WAIT: [TIMEOUT])</text>
  <text x="390" y="340" class="s">idle(n): bus 0                [WAIT]</text>
  <text x="390" y="356" class="s">idle_x(n): bus X               [WAIT]</text>
  <text x="390" y="372" class="s">set_dbg_mode(v)             [DRIVE]</text>
  <text x="390" y="396" class="s">back-to-back transfers keep psel = 1</text>
  <text x="390" y="470" class="s">drive at posedge + #1</text>
  <text x="390" y="486" class="s">return at negedge of the last cycle</text>
  <text x="390" y="502" class="s">transfer logged by u_chk, not here</text>

  <!-- DUT inputs -->
  <line class="w" x1="600" y1="230" x2="760" y2="230" marker-end="url(#arr)"/>
  <text x="608" y="225">tim_psel</text>
  <line class="w" x1="600" y1="260" x2="760" y2="260" marker-end="url(#arr)"/>
  <text x="608" y="255">tim_penable</text>
  <line class="w" x1="600" y1="290" x2="760" y2="290" marker-end="url(#arr)"/>
  <text x="608" y="285">tim_pwrite</text>
  <line class="b" x1="600" y1="320" x2="760" y2="320" marker-end="url(#arr)"/>
  <text x="608" y="314">tim_paddr[11:0]</text>
  <line class="b" x1="600" y1="350" x2="760" y2="350" marker-end="url(#arr)"/>
  <text x="608" y="344">tim_pwdata[31:0]</text>
  <line class="b" x1="600" y1="380" x2="760" y2="380" marker-end="url(#arr)"/>
  <text x="608" y="374">tim_pstrb[3:0]</text>
  <line class="w" x1="600" y1="410" x2="760" y2="410" marker-end="url(#arr)"/>
  <text x="608" y="405">dbg_mode</text>

  <!-- monitor tap on the DUT inputs -->
  <path class="b" d="M740,410 V185 H1210 V200" marker-end="url(#arr)"/>
  <circle class="dot" cx="740" cy="230" r="4.5"/>
  <circle class="dot" cx="740" cy="260" r="4.5"/>
  <circle class="dot" cx="740" cy="290" r="4.5"/>
  <circle class="dot" cx="740" cy="320" r="4.5"/>
  <circle class="dot" cx="740" cy="350" r="4.5"/>
  <circle class="dot" cx="740" cy="380" r="4.5"/>
  <circle class="dot" cx="740" cy="410" r="4.5"/>
  <text x="940" y="179">DUT inputs (7 nets, as applied)</text>

  <!-- ===== u_dut ===== -->
  <rect class="dut" x="760" y="200" width="250" height="320"/>
  <text x="770" y="220" class="t">u_dut : timer_top</text>
  <text x="1002" y="216" class="tag" text-anchor="end">sec 2</text>
  <text x="770" y="237" class="s">rtl/ (sim/rtl.f)</text>
  <rect class="sub" x="785" y="250" width="200" height="34"/>
  <text x="885" y="272" text-anchor="middle">u_apb_slave</text>
  <rect class="sub" x="785" y="295" width="200" height="34"/>
  <text x="885" y="317" text-anchor="middle">u_register</text>
  <rect class="sub" x="785" y="340" width="200" height="34"/>
  <text x="885" y="362" text-anchor="middle">u_cnt_ctrl</text>
  <rect class="sub" x="785" y="385" width="200" height="34"/>
  <text x="885" y="407" text-anchor="middle">u_counter</text>
  <rect class="sub" x="785" y="430" width="200" height="34"/>
  <text x="885" y="452" text-anchor="middle">u_interrupt</text>
  <text x="770" y="500" class="s">checked at the pins only (no internal probes)</text>

  <!-- DUT outputs -->
  <line class="b" x1="1010" y1="250" x2="1150" y2="250" marker-end="url(#arr)"/>
  <text x="1016" y="244">tim_prdata[31:0]</text>
  <line class="w" x1="1010" y1="300" x2="1150" y2="300" marker-end="url(#arr)"/>
  <text x="1016" y="295">tim_pready</text>
  <line class="w" x1="1010" y1="350" x2="1150" y2="350" marker-end="url(#arr)"/>
  <text x="1016" y="345">tim_pslverr</text>
  <line class="w" x1="1010" y1="400" x2="1150" y2="400" marker-end="url(#arr)"/>
  <text x="1016" y="395">tim_int</text>

  <!-- APB handshake back to the driver -->
  <circle class="dot" cx="1110" cy="300" r="4"/>
  <path class="w" d="M1110,300 V545 H620 V480 H600" marker-end="url(#arr)"/>
  <text x="680" y="539" class="s">tim_pready -&gt; u_drv (end of transfer only; timing checked by u_chk)</text>

  <!-- ===== u_mon ===== -->
  <rect class="blk" x="1150" y="200" width="240" height="320"/>
  <text x="1160" y="220" class="t">u_mon</text>
  <text x="1382" y="216" class="tag" text-anchor="end">sec 6</text>
  <text x="1160" y="237">tb_timer_top_mon</text>
  <text x="1160" y="262" class="s">samples every DUT pin at negedge</text>
  <text x="1160" y="276" class="s">(inputs as applied, outputs settled)</text>
  <text x="1160" y="420" class="s">s_*     pin samples, s_time</text>
  <text x="1160" y="434" class="s">s_done  psel &amp; penable &amp; pready</text>
  <text x="1160" y="448" class="s">s_wait  access cycles before it</text>
  <text x="1160" y="462" class="s">s_setup clk of the setup phase</text>
  <text x="1160" y="476" class="s">s_vld   0 before the first edge</text>
  <text x="1160" y="500" class="s">[OBSERVE] tim_int old -&gt; new</text>

  <!-- monitor samples -->
  <path class="b" d="M1190,520 V590 H960 V640" marker-end="url(#arr)"/>
  <text x="972" y="570" class="s">s_* (all pins), s_time,</text>
  <text x="972" y="584" class="s">s_done, s_wait, s_setup, s_vld</text>
  <line class="b" x1="1330" y1="520" x2="1330" y2="640" marker-end="url(#arr)"/>
  <text x="1322" y="625" class="s" text-anchor="end">s_* DUT inputs</text>

  <!-- ===== u_model ===== -->
  <rect class="blk" x="1150" y="640" width="240" height="300"/>
  <text x="1160" y="660" class="t">u_model</text>
  <text x="1382" y="656" class="tag" text-anchor="end">sec 5</text>
  <text x="1160" y="677">tb_timer_top_model</text>
  <text x="1160" y="693" class="s">golden model from doc/spec (not RTL)</text>
  <text x="1160" y="707" class="s">never reads a DUT output</text>
  <text x="1160" y="730" class="s">APB: setup, 1 wait state, last access</text>
  <text x="1160" y="744" class="s">TCR error cond. 1-3 -&gt; pslverr</text>
  <text x="1160" y="758" class="s">byte strobes, TISR RW1C, RAZ / WI</text>
  <text x="1160" y="772" class="s">TDR write ignored if TIM_EN = 1</text>
  <text x="1160" y="786" class="s">64-bit counter, step every 2^DIV_VAL</text>
  <text x="1160" y="800" class="s">dbg_mode &amp; HALT_REQ holds count</text>
  <text x="1160" y="814" class="s">TIM_EN 1 -&gt; 0 clears counter</text>
  <text x="1160" y="828" class="s">INT_ST 1 cycle after cnt == TCMP</text>
  <text x="1160" y="842" class="s">tim_int = INT_ST &amp; INT_EN</text>
  <text x="1160" y="866" class="s">state at posedge, outputs comb.</text>
  <text x="1160" y="890" class="s">err_text() -&gt; note of a u_chk FAIL</text>

  <!-- expected outputs -->
  <line class="b" x1="1150" y1="760" x2="1010" y2="760" marker-end="url(#arr)"/>
  <text x="1016" y="754">exp_prdata[31:0]</text>
  <line class="w" x1="1150" y1="800" x2="1010" y2="800" marker-end="url(#arr)"/>
  <text x="1016" y="795">exp_pready</text>
  <line class="w" x1="1150" y1="840" x2="1010" y2="840" marker-end="url(#arr)"/>
  <text x="1016" y="835">exp_pslverr</text>
  <line class="w" x1="1150" y1="880" x2="1010" y2="880" marker-end="url(#arr)"/>
  <text x="1016" y="875">exp_tim_int</text>

  <!-- ===== u_chk ===== -->
  <rect class="blk" x="760" y="640" width="250" height="300"/>
  <text x="770" y="660" class="t">u_chk</text>
  <text x="1002" y="656" class="tag" text-anchor="end">sec 6</text>
  <text x="770" y="677">tb_timer_top_chk</text>
  <text x="770" y="693" class="s">each sample at negedge + CHK_DLY (1 ns)</text>
  <text x="770" y="716" class="s">transfer completion (s_done), 1 line:</text>
  <text x="770" y="730" class="s">  APB WRITE &lt;REG&gt; ... OK | SLVERR</text>
  <text x="770" y="744" class="s">  APB READ &lt;REG&gt; exp / act PASS | FAIL</text>
  <text x="770" y="764" class="s">watch every other sample:</text>
  <text x="770" y="778" class="s">  pready, pslverr, prdata, tim_int</text>
  <text x="770" y="792" class="s">  only deviations: [WATCH] .. FAIL,</text>
  <text x="770" y="806" class="s">  [WATCH END] when it matches again</text>
  <text x="770" y="826" class="s">checkpoint(what): [CHECK] tim_int</text>
  <text x="770" y="840" class="s">sync: caller waits for this sample</text>
  <text x="770" y="864" class="s">compare with === (X / Z caught)</text>
  <text x="770" y="878" class="s">TDR as counts if tdr_cnt_view</text>
  <text x="770" y="924" class="s">clk_i, clk_cnt_i &lt;- u_clk_rst</text>

  <!-- results -->
  <line class="c" x1="760" y1="800" x2="600" y2="800" marker-end="url(#arr)"/>
  <text x="610" y="794" class="s">check / info</text>

  <!-- ===== u_log ===== -->
  <rect class="blk" x="380" y="640" width="220" height="300"/>
  <text x="390" y="660" class="t">u_log</text>
  <text x="592" y="656" class="tag" text-anchor="end">sec 6</text>
  <text x="390" y="677">tb_timer_top_log</text>
  <text x="390" y="693" class="s">owns pass_count / fail_count</text>
  <text x="390" y="716" class="s">init, banner, item, sub1, sub2, goal</text>
  <text x="390" y="730" class="s">info   event, not counted</text>
  <text x="390" y="744" class="s">check  PASS | FAIL, one count</text>
  <text x="390" y="758" class="s">error_msg, summary</text>
  <text x="390" y="772" class="s">fmt_hex / bin / dec / cnt / bit</text>
  <text x="390" y="820" class="s">prefix [t=&lt;ns&gt; ns clk=&lt;n&gt;]</text>
  <text x="390" y="834" class="s">[ITEM] / [SUBITEM1] / [SUBITEM2] / [GOAL]</text>
  <text x="390" y="848" class="s">[SUMMARY] PASS=n FAIL=n</text>
  <text x="390" y="862" class="s">Test_result: PASSED | FAILED</text>
  <text x="390" y="886" class="s">info from u_clk_rst [RESET],</text>
  <text x="390" y="900" class="s">u_drv [DRIVE] [WAIT], u_mon [OBSERVE]</text>
  <text x="390" y="924" class="s">clk_cnt_i &lt;- u_clk_rst</text>

  <!-- log file -->
  <line class="c" x1="490" y1="940" x2="490" y2="990" marker-end="url(#arr)"/>
  <rect class="seq" x="380" y="990" width="340" height="60"/>
  <text x="390" y="1011">sim/log/TC_TIMER_TOP_&lt;NNN&gt;.log</text>
  <text x="390" y="1029" class="s">read by check_sim_log.py and sim/report.csh</text>

  <!-- ===== legend ===== -->
  <rect x="760" y="990" width="720" height="100" fill="none" stroke="#000" stroke-width="1"/>
  <line class="w" x1="775" y1="1009" x2="815" y2="1009"/>
  <text x="822" y="1013" class="s">1-bit net</text>
  <line class="b" x1="890" y1="1009" x2="930" y2="1009"/>
  <text x="937" y="1013" class="s">bus</text>
  <line class="c" x1="985" y1="1009" x2="1035" y2="1009" marker-end="url(#arr)"/>
  <text x="1042" y="1013" class="s">task call (u_drv.*, u_chk.*, u_log.*, u_clk_rst.*)</text>
  <circle class="dot" cx="1335" cy="1009" r="4"/>
  <text x="1345" y="1013" class="s">junction</text>
  <text x="775" y="1035" class="s">timing: stimulus at posedge + #1 | monitor at negedge | checker at negedge + CHK_DLY | CLK_PERIOD = 20 ns</text>
  <text x="775" y="1055" class="s">dataflow: tc -&gt; u_drv -&gt; u_dut -&gt; u_mon -&gt; u_model -&gt; u_chk -&gt; u_log;  u_mon -&gt; u_chk</text>
  <text x="775" y="1075" class="s">expected values only from u_model; sec N = section of tb/tb_timer_top.v</text>
</svg>
